name: Build & Package Magisk Module

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ProjectX Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui-svelte/package-lock.json'

      - name: Build Svelte WebUI
        run: |
          cd ui-svelte
          npm ci || npm install
          npm run build
          cd ..

      - name: Sync Static Assets
        run: |
          mkdir -p magisk_module/static/assets
          cp -rf static/* magisk_module/static/

      - name: Build Go Multi-Arch Binaries
        run: |
          mkdir -p magisk_module/bin
          
          # ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o magisk_module/bin/projectx_server_arm64 .
          cp magisk_module/bin/projectx_server_arm64 magisk_module/bin/projectx_arm64
          cp magisk_module/bin/projectx_server_arm64 magisk_module/bin/projectx_server

          # ARM32
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o magisk_module/bin/projectx_server_arm .
          cp magisk_module/bin/projectx_server_arm magisk_module/bin/projectx_arm

      - name: Package UNIX-Compatible Magisk Zip
        run: |
          go run tools/make_zip/main.go

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX_Magisk
          path: ProjectX_Magisk.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectX_Magisk.zip
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
