<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Box For Root</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
/* ========== VARIABLES & RESET ========== */
:root {
    --bg: #18151e; --paper: #24202b; --panel-alt: #302b38;
    --ink: #fffaf4; --muted: #aaa2ad; --line: #0d0b10;
    --primary: #c538ff; --secondary: #00e5ff;
    --pink: #ff5ca8; --cyan: #55dfff; --yellow: #ffe14a; 
    --lime: #b8f34a; --orange: #ff9955; --purple: #9b7cff;
    --shadow: 4px 5px 0 #08070a;
    
    /* Semantic Colors for Buttons - Not overridden by themes */
    --action-start: #b8f34a;
    --action-start-text: #000;
    --action-stop: #ff5ca8;
    --action-stop-text: #fff;
    --action-restart: #ffe14a;
    --action-restart-text: #000;
}
:root[data-theme="light"] {
    --bg: #fff6e8; --paper: #fffdf8; --panel-alt: #e8e5da;
    --ink: #17151a; --muted: #77717a; --line: #17151a;
    --shadow: 4px 5px 0 #17151a;
}

/* Color Themes */
:root[data-color="synthwave"] { --pink: #ff2d95; --yellow: #ff2d95; --cyan: #00e5ff; --lime: #ff2d95; --purple: #c538ff; --orange: #ff6b35; }
:root[data-color="synthwave"][data-theme="dark"], :root[data-color="synthwave"]:not([data-theme]) { --panel-alt: #2a1035; }
:root[data-color="toxic"] { --pink: #ff4444; --yellow: #39ff14; --cyan: #39ff14; --lime: #39ff14; --purple: #ff8800; --orange: #ff6600; }
:root[data-color="toxic"][data-theme="dark"], :root[data-color="toxic"]:not([data-theme]) { --panel-alt: #1a2810; }
:root[data-color="arctic"] { --pink: #64b5f6; --yellow: #40c4ff; --cyan: #80d8ff; --lime: #82b1ff; --purple: #448aff; --orange: #29b6f6; }
:root[data-color="arctic"][data-theme="dark"], :root[data-color="arctic"]:not([data-theme]) { --panel-alt: #1a2535; }
:root[data-color="sunset"] { --pink: #ff1744; --yellow: #ff6d00; --cyan: #ffab40; --lime: #ff9100; --purple: #ff5252; --orange: #ff3d00; }
:root[data-color="sunset"][data-theme="dark"], :root[data-color="sunset"]:not([data-theme]) { --panel-alt: #351a10; }
:root[data-color="lavender"] { --pink: #f48fb1; --yellow: #b388ff; --cyan: #ea80fc; --lime: #ce93d8; --purple: #7c4dff; --orange: #e040fb; }
:root[data-color="lavender"][data-theme="dark"], :root[data-color="lavender"]:not([data-theme]) { --panel-alt: #271a35; }

* { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope', system-ui, sans-serif; }
body { background:var(--bg); color:var(--ink); padding:15px; transition:all .2s; height: 100vh; display: flex; flex-direction: column; }
.wrap { max-width:800px; margin:0 auto; width:100%; display: flex; flex-direction: column; flex: 1; overflow: hidden; }

/* ========== HEADER ========== */
.header{ margin-bottom:20px; display: flex; justify-content: space-between; align-items: flex-end; flex-shrink: 0; }
.header-left .eyebrow { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:var(--cyan); display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.live-dot { width:8px; height:8px; background:var(--cyan); border-radius:50%; animation:blink 1.5s infinite; }
@keyframes blink { 0%, 100%{opacity:1;} 50%{opacity:0.4;} }
.header h1 { font-size:28px; font-weight:950; letter-spacing:-1.5px; text-transform:uppercase; color:var(--ink); line-height:1; }
.header .desc { font-size:12px; font-weight:700; color:var(--muted); margin-top:8px; }

/* ========== ACTIONS & TERMINAL ========== */
.card{ background:var(--paper); border:2px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:20px; flex-shrink: 0; }
.btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.btn { border: 2px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 950; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.1s ease; box-shadow: 4px 4px 0px var(--line); text-transform: uppercase; }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--line); filter: brightness(1.1); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn:disabled { opacity: 0.5; pointer-events: none; }

.btn-start   { background: var(--action-start); color: var(--action-start-text); }
.btn-stop    { background: var(--action-stop); color: var(--action-stop-text); }
.btn-restart { background: var(--action-restart); color: var(--action-restart-text); }
.btn-refresh { background: var(--paper); color: var(--ink); padding:8px 12px; }

/* TERMINAL */
.card-terminal { flex: 1; display: flex; flex-direction: column; min-height: 0; background:var(--paper); border:2px solid var(--line); border-radius:16px; padding:0; box-shadow:var(--shadow); margin-bottom:20px; overflow: hidden; }
.terminal-header { padding: 12px 16px; background: var(--panel-alt); border-bottom: 2px solid var(--line); font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

.log-terminal { flex: 1; overflow-y: auto; padding: 15px; background: #08070a; color: #fffaf4; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; scroll-behavior: smooth; }
:root[data-theme="light"] .log-terminal { background: #ffffff; color: #17151a; }
.log-entry { margin-bottom: 4px; word-break: break-all; }
.loading-box { text-align: center; padding: 20px; color: var(--muted); font-weight: 800; text-transform: uppercase; }

    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="header-left">
            <div class="eyebrow"><span class="live-dot"></span> Box For Root</div>
            <h1>BFR Control</h1>
            <div class="desc">Kontrol service tunneling dan proxy Box For Root.</div>
        </div>
        <button class="btn btn-refresh" onclick="fetchLogs()" title="Refresh Logs"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <div class="card">
        <div class="btn-group">
            <button class="btn btn-start" id="btn-start" onclick="execAction('start')"><i class="fa-solid fa-play"></i> Start</button>
            <button class="btn btn-restart" id="btn-restart" onclick="execAction('restart')"><i class="fa-solid fa-rotate"></i> Restart</button>
            <button class="btn btn-stop" id="btn-stop" onclick="execAction('stop')"><i class="fa-solid fa-stop"></i> Stop</button>
        </div>
    </div>

    <div class="card-terminal">
        <div class="terminal-header">
            <span><i class="fa-solid fa-terminal"></i> runs.log</span>
            <span id="log-status" style="color:var(--cyan);"><i class="fa-solid fa-circle-check"></i> Live</span>
        </div>
        <div class="log-terminal" id="logContainer">
            <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Memuat log...</div>
        </div>
    </div>
</div>

<script>
let logInterval;

function setButtonsState(disabled) {
    document.getElementById('btn-start').disabled = disabled;
    document.getElementById('btn-restart').disabled = disabled;
    document.getElementById('btn-stop').disabled = disabled;
}

function execAction(act) {
    setButtonsState(true);
    document.getElementById('logContainer').innerHTML = `<div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Mengeksekusi ${act.toUpperCase()}...</div>`;
    
    fetch('/api/bfr/control', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: act})
    })
    .then(r => r.json())
    .then(res => {
        setTimeout(fetchLogs, 1000); // Fetch after 1s
    })
    .catch(err => {
        console.error(err);
        setTimeout(fetchLogs, 1000);
    })
    .finally(() => {
        setTimeout(() => { setButtonsState(false); }, 1500);
    });
}

function fetchLogs() {
    fetch('/api/bfr/logs')
    .then(r => r.json())
    .then(data => {
        const c = document.getElementById('logContainer');
        if (data.status === 'success') {
            c.innerHTML = data.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
            c.scrollTop = c.scrollHeight;
        } else {
            c.innerHTML = `<div class="loading-box" style="color:var(--pink);"><i class="fa-solid fa-triangle-exclamation"></i> ${data.message}</div>`;
        }
    })
    .catch(err => {
        document.getElementById('logContainer').innerHTML = `<div class="loading-box"><i class="fa-solid fa-wifi"></i> Gagal memuat log.</div>`;
    });
}

function syncTheme(){
    try{
        const parentHtml = window.parent?.document?.documentElement;
        if(parentHtml) {
            const theme = parentHtml.getAttribute('data-theme');
            if(theme && theme !== 'dark') document.documentElement.setAttribute('data-theme', theme);
            else document.documentElement.removeAttribute('data-theme');
            
            const color = parentHtml.getAttribute('data-color');
            if(color && color !== 'default') document.documentElement.setAttribute('data-color', color);
            else document.documentElement.removeAttribute('data-color');
        }
    }catch(e){}
}
syncTheme();
fetchLogs();
logInterval = setInterval(fetchLogs, 5000); // Auto-refresh log
setInterval(syncTheme, 1000);
</script>
</body>
</html>
