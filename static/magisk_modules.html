<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magisk Modules</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
/* ========== VARIABLES & RESET ========== */
:root {
    --bg: #18151e; --paper: #24202b; --panel-alt: #302b38;
    --ink: #fffaf4; --muted: #aaa2ad; --line: #0d0b10;
    --primary: #c538ff; --secondary: #00e5ff;
    --pink: #ff5ca8; --cyan: #55dfff; --yellow: #ffe14a; 
    --lime: #b8f34a; --orange: #ff9955; --purple: #9b7cff;
    --shadow: 4px 5px 0 #08070a;
}
:root[data-theme="light"] {
    --bg: #fff6e8; --paper: #fffdf8; --panel-alt: #e8e5da;
    --ink: #17151a; --muted: #77717a; --line: #17151a;
    --shadow: 4px 5px 0 #17151a;
}

/* Color Themes */
:root[data-color="synthwave"] { --pink: #ff2d95; --yellow: #ff2d95; --cyan: #00e5ff; --lime: #ff2d95; --purple: #c538ff; --orange: #ff6b35; }
:root[data-color="synthwave"][data-theme="dark"], :root[data-color="synthwave"]:not([data-theme]) { --panel-alt: #2a1035; }
:root[data-color="toxic"] { --pink: #ff4444; --yellow: #39ff14; --cyan: #39ff14; --lime: #39ff14; --purple: #ff8800; --orange: #ff6600; }
:root[data-color="toxic"][data-theme="dark"], :root[data-color="toxic"]:not([data-theme]) { --panel-alt: #1a2810; }
:root[data-color="arctic"] { --pink: #64b5f6; --yellow: #40c4ff; --cyan: #80d8ff; --lime: #82b1ff; --purple: #448aff; --orange: #29b6f6; }
:root[data-color="arctic"][data-theme="dark"], :root[data-color="arctic"]:not([data-theme]) { --panel-alt: #1a2535; }
:root[data-color="sunset"] { --pink: #ff1744; --yellow: #ff6d00; --cyan: #ffab40; --lime: #ff9100; --purple: #ff5252; --orange: #ff3d00; }
:root[data-color="sunset"][data-theme="dark"], :root[data-color="sunset"]:not([data-theme]) { --panel-alt: #351a10; }
:root[data-color="lavender"] { --pink: #f48fb1; --yellow: #b388ff; --cyan: #ea80fc; --lime: #ce93d8; --purple: #7c4dff; --orange: #e040fb; }
:root[data-color="lavender"][data-theme="dark"], :root[data-color="lavender"]:not([data-theme]) { --panel-alt: #271a35; }

* { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope', system-ui, sans-serif; }
body { background:var(--bg); color:var(--ink); padding:15px; transition:all .2s; }
.wrap { max-width:800px; margin:0 auto; padding-bottom: 80px; }

/* ========== HEADER ========== */
.header{ margin-bottom:20px; display: flex; justify-content: space-between; align-items: flex-end; }
.header-left .eyebrow { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:var(--cyan); display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.header h1 { font-size:28px; font-weight:950; letter-spacing:-1.5px; text-transform:uppercase; color:var(--ink); line-height:1; }
.header .desc { font-size:12px; font-weight:700; color:var(--muted); margin-top:8px; }

.btn { border: 2px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.1s ease; box-shadow: 3px 3px 0px var(--line); text-transform: uppercase; background: var(--paper); color: var(--ink); }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--line); filter: brightness(1.1); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }

/* ========== MODULE CARDS ========== */
.module-list { display: flex; flex-direction: column; gap: 15px; }

.module-card {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    transition: opacity 0.3s;
}
.module-card.disabled { opacity: 0.7; }
.module-card.pending-del { border-color: var(--pink); border-style: dashed; }

.mod-header { display: flex; justify-content: space-between; align-items: flex-start; }
.mod-title { font-size: 16px; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.mod-version { font-size: 11px; font-weight: 900; background: var(--panel-alt); padding: 2px 8px; border-radius: 50px; border: 1px solid var(--line); color: var(--cyan); }
.mod-author { font-size: 11px; font-weight: 800; color: var(--muted); }
.mod-desc { font-size: 12px; color: var(--ink); line-height: 1.5; font-weight: 500; }

.mod-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; border-top: 2px dashed var(--line); padding-top: 12px; }

/* Toggle Switch Brutalist */
.brutal-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.brutal-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--panel-alt); border: 2px solid var(--line); border-radius: 20px; transition: .2s; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: var(--muted); border-radius: 50%; border: 2px solid var(--line); transition: .2s; }
input:checked + .slider { background-color: var(--lime); }
input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

.btn-trash { background: var(--pink); color: #fff; padding: 6px 10px; font-size: 11px; }
.btn-restore { background: var(--yellow); color: #000; padding: 6px 10px; font-size: 11px; }

.badge-del { position: absolute; top: -10px; right: 10px; background: var(--pink); color: #fff; font-size: 10px; font-weight: 900; padding: 4px 8px; border: 2px solid var(--line); border-radius: 6px; box-shadow: 2px 2px 0 var(--line); transform: rotate(2deg); z-index: 10; text-transform: uppercase; }

/* Loader */
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 800; font-size: 14px; text-transform: uppercase; }

    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="header-left">
            <div class="eyebrow"><i class="fa-solid fa-puzzle-piece"></i> Extension</div>
            <h1>Magisk Modules</h1>
            <div class="desc">Kelola modul root Magisk langsung dari UI.</div>
        </div>
        <button class="btn" onclick="fetchModules()" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <div id="loading" class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i> Membaca Module.prop...
    </div>

    <div class="module-list" id="moduleList"></div>
</div>

<script>
function fetchModules() {
    const list = document.getElementById('moduleList');
    list.innerHTML = '';
    document.getElementById('loading').style.display = 'block';

    fetch('/api/magisk/modules')
    .then(r => r.json())
    .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === 'success') {
            if (data.data && data.data.length > 0) {
                renderModules(data.data);
            } else {
                list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i> Tidak ada modul yang terinstall</div>`;
            }
        } else {
            list.innerHTML = `<div class="empty-state" style="color:var(--pink);"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${data.message}</div>`;
        }
    })
    .catch(err => {
        document.getElementById('loading').style.display = 'none';
        list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-wifi"></i> Gagal koneksi ke server</div>`;
    });
}

function renderModules(modules) {
    const list = document.getElementById('moduleList');
    let html = '';
    
    modules.forEach(m => {
        const isDis = !m.enabled;
        const isDel = m.pending_del;
        
        html += `
        <div class="module-card ${isDis ? 'disabled' : ''} ${isDel ? 'pending-del' : ''}" id="mod-${m.id}">
            ${isDel ? `<div class="badge-del">Akan Dihapus (Reboot)</div>` : ''}
            
            <div class="mod-header">
                <div>
                    <div class="mod-title">${m.name || m.id} <span class="mod-version">${m.version || 'v1.0'}</span></div>
                    <div class="mod-author">by ${m.author || 'Unknown'}</div>
                </div>
            </div>
            
            <div class="mod-desc">${m.description || 'Tidak ada deskripsi.'}</div>
            <div style="font-size:10px; font-family:monospace; color:var(--muted); margin-top:4px;">ID: ${m.id}</div>
            
            <div class="mod-actions">
                <label class="brutal-switch" title="${isDis ? 'Aktifkan' : 'Nonaktifkan'} Modul">
                    <input type="checkbox" onchange="toggleModule('${m.id}', this.checked)" ${m.enabled ? 'checked' : ''} ${isDel ? 'disabled' : ''}>
                    <span class="slider"></span>
                </label>
                
                ${isDel ? `
                    <button class="btn btn-restore" onclick="restoreModule('${m.id}')"><i class="fa-solid fa-rotate-left"></i> Batal Hapus</button>
                ` : `
                    <button class="btn btn-trash" onclick="removeModule('${m.id}')"><i class="fa-solid fa-trash"></i> Hapus</button>
                `}
            </div>
        </div>
        `;
    });
    
    list.innerHTML = html;
}

function toggleModule(id, enable) {
    fetch('/api/magisk/modules/action', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'toggle', id: id, enable: enable})
    })
    .then(r => r.json())
    .then(res => {
        if(res.status === 'success') {
            const card = document.getElementById(`mod-${id}`);
            if(enable) card.classList.remove('disabled');
            else card.classList.add('disabled');
        } else {
            alert(res.message);
            fetchModules(); // revert
        }
    });
}

function removeModule(id) {
    if(!confirm('Modul ini akan ditandai untuk dihapus. Penghapusan terjadi saat perangkat direboot. Lanjutkan?')) return;
    
    fetch('/api/magisk/modules/action', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'remove', id: id})
    })
    .then(r => r.json())
    .then(res => {
        if(res.status === 'success') fetchModules();
        else alert(res.message);
    });
}

function restoreModule(id) {
    fetch('/api/magisk/modules/action', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'restore', id: id})
    })
    .then(r => r.json())
    .then(res => {
        if(res.status === 'success') fetchModules();
        else alert(res.message);
    });
}

function syncTheme(){
    try{
        const parentHtml = window.parent?.document?.documentElement;
        if(parentHtml) {
            const theme = parentHtml.getAttribute('data-theme');
            if(theme && theme !== 'dark') document.documentElement.setAttribute('data-theme', theme);
            else document.documentElement.removeAttribute('data-theme');
            
            const color = parentHtml.getAttribute('data-color');
            if(color && color !== 'default') document.documentElement.setAttribute('data-color', color);
            else document.documentElement.removeAttribute('data-color');
        }
    }catch(e){}
}
syncTheme();
fetchModules();
setInterval(syncTheme, 1000);
</script>
</body>
</html>
