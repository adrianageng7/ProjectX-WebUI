<!DOCTYPE html>
<html lang="id" data-theme="dark" data-color="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login — ProjectX</title>
    
    <link class="favicon-icon" rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <meta name="theme-color" content="#18151e">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        :root {
            /* === DARK MODE (DEFAULT) === */
            --bg: #18151e;
            --paper: #24202b;
            --ink: #fffaf4;
            --muted: #aaa2ad;
            --line: #0d0b10;
            --shadow: 4px 5px 0 #08070a;
            --panel-alt: #302b38;
            
            /* === DEFAULT COLOR ACCENT: RETRO POP === */
            --pink: #ff5ca8;
            --yellow: #ffe14a;
            --cyan: #55dfff;
            --lime: #b8f34a;
            --purple: #9b7cff;
            --orange: #ff9955;
            
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* MAP ALIASES */
            --border-width: 2px;
            --border-color: var(--line);
            --bg-body: var(--bg);
            --panel-bg: var(--paper);
            --panel-bg-alt: var(--panel-alt);
            --text: var(--ink);
            --text-muted: var(--muted);
            
            --primary: var(--yellow);
            --primary-text: #000000;
            --secondary: var(--pink);
            --accent: var(--cyan);
            
            --brutal-shadow: var(--shadow);
            --brutal-shadow-sm: 3px 3px 0px var(--line);
        }

        /* === LIGHT MODE === */
        :root[data-theme="light"] {
            --bg: #fff6e8;
            --paper: #fffdf8;
            --ink: #17151a;
            --muted: #77717a;
            --line: #17151a;
            --shadow: 4px 5px 0 #17151a;
            --panel-alt: #e8e5da;
        }
        
        /* ===== COLOR SCHEMES ===== */
        :root[data-color="synthwave"] {
            --pink: #ff2d95;
            --yellow: #ff2d95;
            --cyan: #00e5ff;
            --lime: #ff2d95;
            --purple: #c538ff;
            --orange: #ff6b35;
            --primary-text: #ffffff;
        }
        :root[data-color="synthwave"][data-theme="dark"] {
            --panel-alt: #2a1035;
        }
        
        :root[data-color="toxic"] {
            --pink: #ff4444;
            --yellow: #39ff14;
            --cyan: #39ff14;
            --lime: #39ff14;
            --purple: #ff8800;
            --orange: #ff6600;
            --primary-text: #000000;
        }
        :root[data-color="toxic"][data-theme="dark"] {
            --panel-alt: #1a2810;
        }
        
        :root[data-color="arctic"] {
            --pink: #64b5f6;
            --yellow: #40c4ff;
            --cyan: #80d8ff;
            --lime: #82b1ff;
            --purple: #448aff;
            --orange: #29b6f6;
            --primary-text: #000000;
        }
        :root[data-color="arctic"][data-theme="dark"] {
            --panel-alt: #1a2535;
        }
        
        :root[data-color="sunset"] {
            --pink: #ff1744;
            --yellow: #ff6d00;
            --cyan: #ffab40;
            --lime: #ff9100;
            --purple: #ff5252;
            --orange: #ff3d00;
            --primary-text: #000000;
        }
        :root[data-color="sunset"][data-theme="dark"] {
            --panel-alt: #351a10;
        }
        
        :root[data-color="lavender"] {
            --pink: #f48fb1;
            --yellow: #b388ff;
            --cyan: #ea80fc;
            --lime: #ce93d8;
            --purple: #7c4dff;
            --orange: #e040fb;
            --primary-text: #000000;
        }
        :root[data-color="lavender"][data-theme="dark"] {
            --panel-alt: #271a35;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* HEADER QUICK CONTROLS */
        .top-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .btn-ctrl {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            color: var(--text);
            width: 38px; height: 38px;
            border-radius: 11px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.12s ease;
            font-size: 14px;
            box-shadow: var(--brutal-shadow-sm);
        }
        .btn-ctrl:hover {
            background: var(--primary);
            color: var(--primary-text);
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-color);
        }
        .btn-ctrl:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* LOGIN CONTAINER & CARD */
        .login-wrap {
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        /* DECORATIVE RETRO STICKER */
        .retro-sticker {
            position: absolute;
            top: -18px;
            right: -10px;
            background: var(--primary);
            color: var(--primary-text);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 9px;
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 2px 2px 0 var(--border-color);
            transform: rotate(5deg);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: stickerSway 3s ease-in-out infinite alternate;
        }
        @keyframes stickerSway {
            0% { transform: rotate(5deg); }
            100% { transform: rotate(8deg) translateY(-2px); }
        }

        .login-card {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--brutal-shadow);
            padding: 32px 26px;
            position: relative;
            transform: rotate(-0.4deg);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-card:hover {
            transform: rotate(0deg);
        }

        /* GRADIENT ACCENT STRIP ON TOP OF CARD */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 24px; right: 24px;
            height: 4px;
            background: linear-gradient(90deg, var(--pink), var(--primary), var(--cyan), var(--purple));
            border-radius: 0 0 4px 4px;
        }

        /* BRAND SECTION */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }

        .brand-icon-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .brand-icon {
            width: 52px; height: 52px;
            background: var(--primary);
            color: var(--primary-text);
            border: var(--border-width) solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--brutal-shadow-sm);
            display: grid;
            place-items: center;
            font-size: 24px;
            transform: rotate(-4deg);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .brand-icon:hover {
            transform: rotate(0deg) scale(1.08);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--lime);
            box-shadow: 2px 2px 0 var(--border-color);
            color: #17151a;
            font-size: 8px;
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            transform: rotate(-1.5deg);
        }
        .live-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #17151a;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .brand-title {
            font-size: 24px;
            font-weight: 950;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* FORM ELEMENTS */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.15s ease;
        }

        .form-control {
            width: 100%;
            background: var(--panel-bg-alt);
            color: var(--text);
            border: var(--border-width) solid var(--border-color);
            padding: 12px 42px 12px 40px;
            border-radius: 10px;
            font-family: var(--font);
            font-weight: 800;
            font-size: 13px;
            transition: all 0.15s ease;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }
        .form-control:focus {
            background: var(--panel-bg);
            border-color: var(--border-color);
            box-shadow: var(--brutal-shadow-sm);
            transform: translate(-1px, -1px);
        }
        .input-wrapper:focus-within .input-icon {
            color: var(--text);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            font-size: 14px;
            transition: color 0.15s ease;
        }
        .toggle-password:hover {
            color: var(--text);
        }

        /* SUBMIT BUTTON */
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: var(--primary-text);
            font-weight: 950;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: var(--border-width) solid var(--border-color);
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: var(--brutal-shadow-sm);
            transition: all 0.12s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--brutal-shadow);
        }
        .btn-submit:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* ALERT */
        .alert-error {
            background: var(--secondary);
            color: #ffffff;
            border: var(--border-width) solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            margin-bottom: 18px;
            box-shadow: var(--brutal-shadow-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* FOOTER INFO */
        .login-footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* MODAL */
        .custom-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            padding: 16px;
        }
        .custom-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 380px;
            max-width: 100%;
            box-shadow: var(--brutal-shadow);
            transform: scale(0.9);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-modal.show .modal-card {
            transform: scale(1) rotate(-0.5deg);
        }

        .modal-title {
            font-size: 13px;
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--primary);
            color: var(--primary-text);
            padding: 4px 10px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 6px;
            box-shadow: 2px 2px 0 var(--border-color);
            display: inline-block;
            margin-bottom: 12px;
            transform: rotate(-1.5deg);
        }

        .modal-body {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text);
            margin-bottom: 16px;
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        
        .color-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 8px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: var(--brutal-shadow-sm);
            transition: all 0.1s ease;
            font-weight: 800;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .color-card:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-color);
        }
        .color-card:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        
        .color-dots {
            display: flex;
            gap: 4px;
        }
        .color-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.3);
        }
        
        .color-card.selected::after {
            content: '✓';
            position: absolute;
            top: 3px; right: 5px;
            font-size: 10px;
            font-weight: 900;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-modal {
            padding: 8px 16px;
            font-weight: 950;
            font-size: 11px;
            border-radius: 8px;
            border: var(--border-width) solid var(--border-color);
            cursor: pointer;
            box-shadow: var(--brutal-shadow-sm);
            text-transform: uppercase;
            transition: all 0.1s ease;
        }
        .btn-modal:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-color);
        }
        .btn-modal:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- TOP-RIGHT THEME & COLOR CONTROLS -->
    <div class="top-controls">
        <button class="btn-ctrl" onclick="toggleMode()" id="modeToggleBtn" title="Ganti Mode (Terang/Gelap)">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="btn-ctrl" onclick="openColorModal()" title="Ganti Kombinasi Warna">
            <i class="fa-solid fa-palette"></i>
        </button>
    </div>

    <!-- LOGIN WRAPPER & CARD -->
    <div class="login-wrap">
        <div class="retro-sticker">
            <i class="fa-solid fa-shield-halved"></i> AUTH V1.0
        </div>

        <div class="login-card">
            <div class="brand-section">
                <div class="brand-icon-wrap">
                    <div class="brand-icon" style="padding: 4px; overflow: hidden;">
                        <img src="assets/favicon.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;">
                    </div>
                </div>
                <div class="brand-badge">
                    <span class="live-dot"></span> SECURE GATEWAY
                </div>
                <div class="brand-title">ProjectX</div>
                <div class="brand-subtitle">Control Panel Authentication</div>
            </div>

            <div class="alert-error" id="error-alert" style="display: none;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div id="error-text"></div>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">
                        <span>Username</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" name="username" id="username" class="form-control" placeholder="admin" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 22px;">
                    <label class="form-label" for="password">
                        <span>Password</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Lihat/Sembunyikan Password">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Masuk Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <span>PROJECTX CORE</span>
                <span>AUTHORIZED ACCESS ONLY</span>
            </div>
        </div>
    </div>

    <!-- MODAL: KOMBINASI WARNA -->
    <div class="custom-modal" id="colorModal">
        <div class="modal-card">
            <div class="modal-title"><i class="fa-solid fa-palette"></i> Kombinasi Warna</div>
            <div class="modal-body">
                Pilih kombinasi warna aksen dashboard:
                <div class="color-picker-grid" id="colorPickerGrid">
                    
                    <div class="color-card" onclick="setColor('default')" data-color="default"
                         style="background:#ffe14a; color:#17151a;">
                        <div class="color-dots">
                            <span class="color-dot" style="background:#ffe14a"></span>
                            <span class="color-dot" style="background:#ff5ca8"></span>
                            <span class="color-dot" style="background:#55dfff"></span>
                            <span class="color-dot" style="background:#b8f34a"></span>
                        </div>
                        Retro Pop
                    </div>

                    <div class="color-card" onclick="setColor('synthwave')" data-color="synthwave"
                         style="background:#ff2d95; color:#ffffff;">
                        <div class="color-dots">
                            <span class="color-dot" style="background:#ff2d95"></span>
                            <span class="color-dot" style="background:#00e5ff"></span>
                            <span class="color-dot" style="background:#c538ff"></span>
                            <span class="color-dot" style="background:#ff6b35"></span>
                        </div>
                        Synthwave
                    </div>
                    
                    <div class="color-card" onclick="setColor('toxic')" data-color="toxic"
                         style="background:#39ff14; color:#000000;">
                        <div class="color-dots">
                            <span class="color-dot" style="background:#39ff14"></span>
                            <span class="color-dot" style="background:#ff4444"></span>
                            <span class="color-dot" style="background:#ff8800"></span>
                            <span class="color-dot" style="background:#ff6600"></span>
                        </div>
                        Toxic
                    </div>

                    <div class="color-card" onclick="setColor('arctic')" data-color="arctic"
                         style="background:#40c4ff; color:#000000;">
                        <div class="color-dots">
                            <span class="color-dot" style="background:#40c4ff"></span>
                            <span class="color-dot" style="background:#80d8ff"></span>
                            <span class="color-dot" style="background:#448aff"></span>
                            <span class="color-dot" style="background:#64b5f6"></span>
                        </div>
                        Arctic
                    </div>
                    
                    <div class="color-card" onclick="setColor('sunset')" data-color="sunset"
                         style="background:#ff6d00; color:#ffffff;">
                        <div class="color-dots">
                            <span class="color-dot" style="background:#ff6d00"></span>
                            <span class="color-dot" style="background:#ff1744"></span>
                            <span class="color-dot" style="background:#ffab40"></span>
                            <span class="color-dot" style="background:#ff3d00"></span>
                        </div>
                        Sunset
                    </div>

                    <div class="color-card" onclick="setColor('lavender')" data-color="lavender"
                         style="background:#b388ff; color:#000000;">
                        <div class="color-dots">
                            <span class="color-dot" style="background:#b388ff"></span>
                            <span class="color-dot" style="background:#ea80fc"></span>
                            <span class="color-dot" style="background:#f48fb1"></span>
                            <span class="color-dot" style="background:#7c4dff"></span>
                        </div>
                        Lavender
                    </div>
                    
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal" onclick="closeColorModal()" style="background:var(--panel-bg-alt); color:var(--text);">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const html = document.documentElement;
        
        // Membaca mode & warna tersimpan dari localStorage (identik dengan index.php)
        const savedMode = localStorage.getItem('brutalist_mode') || localStorage.getItem('brutalist_theme') || 'dark';
        html.setAttribute('data-theme', savedMode);
        
        const savedColor = localStorage.getItem('brutalist_color') || 'default';
        html.setAttribute('data-color', savedColor);

        function updateModeIcon() {
            const icon = document.querySelector('#modeToggleBtn i');
            if (!icon) return;
            const isDark = html.getAttribute('data-theme') === 'dark';
            icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        function toggleMode() {
            const cur = html.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('brutalist_mode', next);
            localStorage.setItem('brutalist_theme', next);
            updateModeIcon();
        }

        function openColorModal() {
            document.querySelectorAll('.color-card').forEach(c => c.classList.remove('selected'));
            const cur = html.getAttribute('data-color') || 'default';
            const active = document.querySelector(`.color-card[data-color="${cur}"]`);
            if (active) active.classList.add('selected');
            document.getElementById('colorModal').classList.add('show');
        }

        function closeColorModal() {
            document.getElementById('colorModal').classList.remove('show');
        }

        function setColor(colorName) {
            html.setAttribute('data-color', colorName);
            localStorage.setItem('brutalist_color', colorName);
            
            document.querySelectorAll('.color-card').forEach(c => c.classList.remove('selected'));
            const active = document.querySelector(`.color-card[data-color="${colorName}"]`);
            if (active) active.classList.add('selected');
            closeColorModal();
        }

        // Toggle intip Password
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        // Tutup modal jika klik di luar modal-card
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('colorModal');
            if (modal.classList.contains('show') && e.target === modal) {
                closeColorModal();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateModeIcon();
        });
    </script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
    });
    const data = await res.json();
    if (data.status === 'success') {
        window.location.href = '/index.html';
    } else {
        document.getElementById('error-alert').style.display = 'flex';
        document.getElementById('error-text').innerText = data.message;
    }
});
</script>
</body>
</html>
